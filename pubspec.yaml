name: pokke
description: "Pokke - Music app with Liquid Glass UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^5.2.1
  http: ^1.2.1
  glassmorphism: ^3.0.0
  icons_plus: ^5.0.0
  palette_generator: ^0.3.3+3
  supabase_flutter: ^2.5.6
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  video_player: ^2.8.2
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.2
  google_fonts: ^6.1.0
  lottie: ^3.1.0
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  dio: ^5.4.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  share_plus: ^7.2.2
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/pokke_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/pokke_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
