<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>pokke · Spotify</title>
  <script>
    // Pass query string back to Flutter web auth
    const q = window.location.search || window.location.hash;
    if (window.opener) {
      window.opener.postMessage(q, '*');
      window.close();
    } else {
      // deep link style for flutter_web_auth_2
      document.body.innerText = 'Puedes cerrar esta ventana.';
    }
  </script>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:24px;">
  Conectando Spotify…
</body>
</html>
