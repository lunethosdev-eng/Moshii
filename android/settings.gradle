pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null, "flutter.sdk not set in local.properties"
        return path
    }
    settings.ext.flutterSdkPath = flutterSdkPath()
    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.1" apply false
    id "com.android.library" version "9.1.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.20" apply false
    id "org.jetbrains.kotlin.plugin.serialization" version "2.4.20" apply false
    id "org.jetbrains.kotlin.multiplatform" version "2.4.20" apply false
    id "org.jetbrains.compose" version "1.10.3" apply false
}
include ":app", ":bitchord-shared", ":bitchord-sharedui"
project(":bitchord-shared").projectDir = file("../integration/bitchord/shared")
project(":bitchord-sharedui").projectDir = file("../integration/bitchord/sharedUi")
