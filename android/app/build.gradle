plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) { localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) } }
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.pokke.music"
    compileSdk 37
    ndkVersion flutter.ndkVersion
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
    defaultConfig {
        applicationId "com.pokke.app"
        manifestPlaceholders += [appAuthRedirectScheme: "pokke"]
        minSdk 26
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        vectorDrawables { useSupportLibrary true }
    }
    buildTypes { release { signingConfig signingConfigs.debug } }
    androidResources { noCompress += ['mp4', 'webm'] }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}
flutter { source '../..' }

configurations {
    newPipeExtractorRaw { transitive = false; canBeConsumed = false }
}
def newPipeExtractorStripped = tasks.register('stripNewPipeExtractorUtils', Jar) {
    archiveFileName = 'NewPipeExtractor-v0.26.3-noutils.jar'
    destinationDirectory = layout.buildDirectory.dir('stripped-libs')
    from({ configurations.newPipeExtractorRaw.collect { zipTree(it) } }) {
        exclude 'org/schabi/newpipe/extractor/utils/Utils.class'
        exclude 'org/schabi/newpipe/extractor/utils/Utils$*.class'
    }
}

dependencies {
    implementation project(':bitchord-sharedui')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.multidex:multidex:2.0.1'
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    newPipeExtractorRaw 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'
    implementation files(newPipeExtractorStripped)
    implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.35.0'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
